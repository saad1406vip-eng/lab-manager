<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1565c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="جرد المختبر">
<title>نظام جرد المختبر | Lab Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ═══════════════ الهيدر ═══════════════ -->
<header class="app-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-icon">🧪</span>
      <div class="logo-text">
        <h1>نظام جرد المختبر</h1>
        <p class="subtitle">مستشفى سبت العلايا</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="homeBtn" title="الرئيسية" onclick="goHome()">
        <span>🏠</span>
      </button>
      <button class="icon-btn" id="adminBtn" title="الإدارة" onclick="goAdmin()">
        <span>⚙️</span>
      </button>
      <button class="icon-btn" id="refreshBtn" title="تحديث" onclick="refreshAll()">
        <span>↻</span>
      </button>
    </div>
  </div>
</header>

<!-- ═══════════════ الصفحة 1: الجرد ═══════════════ -->
<div class="page active" id="page-inventory">

  <div class="card welcome-card">
    <div class="welcome-icon">📋</div>
    <h2 class="welcome-title">مرحباً بك</h2>
    <p class="welcome-text">اختر اسمك والجهاز لبدء الجرد</p>
  </div>

  <div class="card">
    <label class="field-label">
      <span class="field-icon">👤</span>
      <span>اسم الموظف</span>
    </label>
    <select class="form-select" id="employeeSelect" onchange="onEmployeeChange()">
      <option value="">— اختر اسمك من القائمة —</option>
    </select>
  </div>

  <div class="card">
    <label class="field-label">
      <span class="field-icon">🔬</span>
      <span>الجهاز</span>
    </label>
    <select class="form-select" id="deviceSelect" onchange="onDeviceChange()" disabled>
      <option value="">— اختر الجهاز —</option>
    </select>
  </div>

  <div id="inventoryContent"></div>

</div>

<!-- ═══════════════ الصفحة 2: الإدارة ═══════════════ -->
<div class="page" id="page-admin">

  <div class="card welcome-card">
    <div class="welcome-icon">⚙️</div>
    <h2 class="welcome-title">لوحة الإدارة</h2>
    <p class="welcome-text">إدارة الموظفين وربطهم بالأجهزة</p>
  </div>

  <!-- إدارة الموظفين -->
  <div class="card">
    <div class="card-header">
      <span class="card-icon">👥</span>
      <h3 class="card-title">الموظفون</h3>
      <span class="card-badge" id="employeesCount">0</span>
    </div>

    <div class="add-employee-row">
      <input 
        type="text" 
        class="form-input" 
        id="newEmployeeName" 
        placeholder="اسم الموظف الجديد"
      >
      <button class="btn-icon-primary" onclick="addNewEmployee()" title="إضافة">
        ➕
      </button>
    </div>

    <div class="employees-list" id="employeesList"></div>
  </div>

  <!-- إدارة الأجهزة -->
  <div class="card">
    <div class="card-header">
      <span class="card-icon">🔬</span>
      <h3 class="card-title">الأجهزة</h3>
      <span class="card-badge" id="devicesCount">0</span>
    </div>
    <div class="devices-list" id="devicesList"></div>
  </div>

  <!-- ربط الموظفين بالأجهزة -->
  <div class="card">
    <div class="card-header">
      <span class="card-icon">🔗</span>
      <h3 class="card-title">ربط الموظف بالأجهزة</h3>
    </div>

    <div class="form-group">
      <label class="field-label">
        <span class="field-icon">👤</span>
        <span>اختر الموظف</span>
      </label>
      <select class="form-select" id="adminEmployeeSelect" onchange="renderDeviceCheckboxes()">
        <option value="">— اختر —</option>
      </select>
    </div>

    <div class="form-group">
      <label class="field-label">
        <span class="field-icon">🔬</span>
        <span>الأجهزة المخصصة</span>
      </label>
      <div class="checkbox-grid" id="adminDevicesCheckbox"></div>
    </div>

    <button class="btn-primary-full" onclick="saveEmployeeDevices()">
      💾 حفظ الربط
    </button>
  </div>

  <!-- الإحصائيات -->
  <div class="card">
    <div class="card-header">
      <span class="card-icon">📊</span>
      <h3 class="card-title">إحصائيات سريعة</h3>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>

</div>

<!-- ═══════════════ نافذة التعديل / الإضافة ═══════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="modalTitle">تعديل البند</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="modal-body">

      <div class="form-group">
        <label class="field-label">
          <span class="field-icon">🧪</span>
          <span>اسم البند</span>
        </label>
        <input class="form-input" id="itemName" placeholder="مثال: Glucose Reagent">
      </div>

      <div class="form-group">
        <label class="field-label">
          <span class="field-icon">🏷️</span>
          <span>نوع البند</span>
        </label>
        <select class="form-select" id="itemType">
          <option value="reagents">🧪 كاشف (Reagent)</option>
          <option value="calibrators">⚖️ معايرة (Calibrator)</option>
          <option value="qc">🔬 ضبط جودة (QC)</option>
          <option value="solutions">💧 محلول تشغيل (Solution)</option>
          <option value="parts">⚙️ قطعة / إلكترود (Part)</option>
        </select>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">🔢</span>
            <span>الكمية الحالية</span>
          </label>
          <input class="form-input" id="itemQty" type="number" min="0" placeholder="0" inputmode="numeric">
        </div>
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">⚠️</span>
            <span>حد التنبيه</span>
          </label>
          <input class="form-input" id="itemMinQty" type="number" min="0" placeholder="5" inputmode="numeric">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">🏷️</span>
            <span>رقم الكتة (Lot)</span>
          </label>
          <input class="form-input" id="itemLot" placeholder="اختياري">
        </div>
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">📅</span>
            <span>تاريخ الانتهاء</span>
          </label>
          <input class="form-input" id="itemExpiry" type="date">
        </div>
      </div>

      <div class="form-row-2">
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">📂</span>
            <span>تاريخ الفتح</span>
          </label>
          <input class="form-input" id="itemOpenDate" type="date">
        </div>
        <div class="form-group">
          <label class="field-label">
            <span class="field-icon">⏱️</span>
            <span>صلاحية الكتة (يوم)</span>
          </label>
          <input class="form-input" id="itemKitDays" type="number" min="1" placeholder="14" inputmode="numeric">
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">
          <span class="field-icon">📍</span>
          <span>الموقع</span>
        </label>
        <input class="form-input" id="itemLocation" placeholder="مثال: ثلاجة 1 - رف A">
      </div>

      <div class="form-group">
        <label class="field-label">
          <span class="field-icon">📝</span>
          <span>ملاحظة</span>
        </label>
        <input class="form-input" id="itemNote" placeholder="اختياري">
      </div>

    </div>

    <div class="modal-footer">
      <button class="btn-save" onclick="saveItem()">💾 حفظ</button>
      <button class="btn-delete-modal" id="btnDeleteModal" onclick="deleteFromModal()">🗑 حذف البند</button>
    </div>
  </div>
</div>

<!-- ═══════════════ Toast ═══════════════ -->
<div class="toast" id="toast"></div>

<!-- ═══════════════ Scripts ═══════════════ -->
<script src="./data.js"></script>
<script src="./inventory-system.js"></script>

</body>
</html>
