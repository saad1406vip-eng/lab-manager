<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1565c0">
<title>نظام جرد المختبر - Lab Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- ═══════════════ الهيدر ═══════════════ -->
<header class="app-header">
  <div class="header-inner">
    <div class="logo-area">
      <span class="logo-icon">📋</span>
      <div>
        <h1>نظام جرد المختبر</h1>
        <p class="subtitle">تجمع عسير الصحي - مستشفى سبت العلايا</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="homeBtn" title="الرئيسية" onclick="showPage('inventory')">🏠</button>
      <button class="icon-btn" id="settingsBtn" title="الإدارة" onclick="showPage('admin')">⚙️</button>
      <button class="icon-btn" id="refreshBtn" title="تحديث" onclick="refreshAll()">↻</button>
    </div>
  </div>
</header>

<!-- ═══════════════ صفحة 1: الموظف (الجرد) ═══════════════ -->
<div class="page active" id="page-inventory">

  <div class="card hero-card">
    <div class="hero-title">📋 نظام الجرد</div>
    <p class="hint">اختر اسمك والجهاز الذي ستجرده</p>
  </div>

  <div class="card">
    <div class="card-title">👤 اختر اسمك</div>
    <select class="form-input" id="employeeSelect" onchange="updateDevices()">
      <option value="">-- اختر اسمك --</option>
    </select>
  </div>

  <div class="card">
    <div class="card-title">🔧 اختر الجهاز</div>
    <select class="form-input" id="deviceSelect" onchange="startInventory()">
      <option value="">-- اختر الجهاز --</option>
    </select>
  </div>

  <div id="inventoryContent"></div>

</div>

<!-- ═══════════════ صفحة 2: الإدارة ═══════════════ -->
<div class="page" id="page-admin">

  <div class="card hero-card">
    <div class="hero-title">⚙️ لوحة الإدارة</div>
    <p class="hint">إضافة وربط الموظفين والأجهزة</p>
  </div>

  <div class="card">
    <div class="card-title">👥 إدارة الموظفين</div>
    <div class="admin-section">
      <div class="form-group">
        <label class="form-label">إضافة موظف جديد:</label>
        <input class="form-input" id="newEmployeeName" placeholder="اسم الموظف">
        <button class="btn-primary" onclick="addEmployee()">➕ إضافة</button>
      </div>
      <div class="employees-list" id="employeesList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔧 إدارة الأجهزة</div>
    <div class="admin-section">
      <div id="devicesList"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">🔗 ربط الموظفين بالأجهزة</div>
    <div class="admin-section">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">اختر الموظف:</label>
          <select class="form-input" id="adminEmployeeSelect" onchange="renderDeviceCheckboxes()"></select>
        </div>
        <div class="form-group">
          <label class="form-label">اختر الأجهزة:</label>
          <div id="adminDevicesCheckbox"></div>
        </div>
      </div>
      <button class="btn-primary" onclick="saveEmployeeDevices()">💾 حفظ الربط</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📊 الجرود السابقة</div>
    <div class="admin-section">
      <div id="previousInventories"></div>
    </div>
  </div>

</div>

<!-- ═══════════════ Modal الإضافة/التعديل ═══════════════ -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">تعديل المحلول</span>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>

    <div class="form-group">
      <label class="form-label">اسم المحلول:</label>
      <input class="form-input" id="itemName" disabled>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">الكمية الحالية:</label>
        <input class="form-input" id="itemQty" type="number" min="0" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">الحد الأدنى:</label>
        <input class="form-input" id="itemMinQty" type="number" min="0" placeholder="5">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Lot#:</label>
        <input class="form-input" id="itemLot" placeholder="رقم الكتة">
      </div>
      <div class="form-group">
        <label class="form-label">تاريخ الانتهاء:</label>
        <input class="form-input" id="itemExpiry" type="date">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">تاريخ الفتح:</label>
      <input class="form-input" id="itemOpenDate" type="date">
    </div>

    <div class="form-group">
      <label class="form-label">صلاحية الكتة (يوم):</label>
      <input class="form-input" id="itemKitDays" type="number" min="1" placeholder="14">
    </div>

    <div class="form-group">
      <label class="form-label">الموقع:</label>
      <input class="form-input" id="itemLocation" placeholder="مثال: ثلاجة 1">
    </div>

    <div class="form-group">
      <label class="form-label">ملاحظة:</label>
      <input class="form-input" id="itemNote" placeholder="ملاحظات إضافية">
    </div>

    <button class="btn-save" onclick="saveItem()">💾 حفظ</button>
  </div>
</div>

<!-- ═══════════════ Toast ═══════════════ -->
<div class="toast" id="toast"></div>

<!-- ═══════════════ Scripts ═══════════════ -->
<script src="./data.js"></script>
<script src="./inventory-system.js"></script>
<script>
  // معالج الأخطاء العام
  window.addEventListener('error', function(event) {
    console.error('❌ خطأ:', event.error);
  });

  // تهيئة النظام
  document.addEventListener('DOMContentLoaded', function() {
    try {
      console.log('✅ تم تحميل الصفحة بنجاح');
      console.log('📊 عدد الموظفين:', EMPLOYEES_LIST ? EMPLOYEES_LIST.length : 0);
      console.log('🔧 عدد الأجهزة:', SUPPLY_DATA ? Object.keys(SUPPLY_DATA).length : 0);
      
      if (typeof initInventorySystem === 'function') {
        initInventorySystem();
        console.log('✅ تم تهيئة النظام بنجاح');
      } else {
        console.error('❌ دالة initInventorySystem غير موجودة');
      }
    } catch (error) {
      console.error('❌ خطأ في التهيئة:', error);
      alert('⚠️ حدث خطأ في تحميل النظام. تحقق من Console');
    }
  });

  // اختبار الدوال
  console.log('🔍 اختبار الدوال:');
  console.log('showPage:', typeof showPage);
  console.log('startInventory:', typeof startInventory);
  console.log('editSupply:', typeof editSupply);
</script>

</body>
</html>
